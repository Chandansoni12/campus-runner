<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Create Pin - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="wallet-page">
  <div class="status-ber status-ber-sub">
    <div class="time">9:41</div>
    <div class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="1" fill="white" />
        <rect x="5" y="5" width="3" height="7" rx="1" fill="white" />
        <rect x="10" y="2" width="3" height="10" rx="1" fill="white" />
        <rect x="15" y="0" width="3" height="12" rx="1" fill="white" />
      </svg><svg width="24" height="12" viewBox="0 0 24 12" fill="none">
        <rect x="1" y="1" width="18" height="10" rx="2" stroke="white" stroke-width="2" />
        <rect x="3" y="3" width="14" height="6" rx="1" fill="white" />
        <rect x="20" y="4" width="3" height="4" rx="1" fill="white" />
      </svg></div>
  </div>
  <div class="wallet-flow">
    <header class="profile-flow-header">
      <a href="security.html" class="back-btn-profile" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg></a>
      <h1 class="profile-flow-title">Create Pin</h1>
    </header>
    <main class="wallet-main verify-main">
      <h2 class="verify-heading">Please create your 4-digit Pin</h2>
      <div class="pin-boxes" id="pinBoxes">
        <input type="password" class="otp-box pin-box" maxlength="1" data-i="0" inputmode="numeric">
        <input type="password" class="otp-box pin-box" maxlength="1" data-i="1" inputmode="numeric">
        <input type="password" class="otp-box pin-box" maxlength="1" data-i="2" inputmode="numeric">
        <input type="password" class="otp-box pin-box" maxlength="1" data-i="3" inputmode="numeric">
      </div>
      <button type="button" class="btn-profile-primary" id="verifyPinBtn">Verify</button>
      <div class="numpad" id="pinNumpad">
        <button type="button" class="numpad-btn" data-n="1">1</button>
        <button type="button" class="numpad-btn" data-n="2">2</button>
        <button type="button" class="numpad-btn" data-n="3">3</button>
        <button type="button" class="numpad-btn" data-n="4">4</button>
        <button type="button" class="numpad-btn" data-n="5">5</button>
        <button type="button" class="numpad-btn" data-n="6">6</button>
        <button type="button" class="numpad-btn" data-n="7">7</button>
        <button type="button" class="numpad-btn" data-n="8">8</button>
        <button type="button" class="numpad-btn" data-n="9">9</button>
        <button type="button" class="numpad-btn numpad-empty"></button>
        <button type="button" class="numpad-btn" data-n="0">0</button>
        <button type="button" class="numpad-btn numpad-back" id="pinNumpadBack" aria-label="Backspace"><svg width="24"
            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2" />
            <path d="M10 11l4 4M14 11l-4 4" />
          </svg></button>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      var boxes = document.querySelectorAll('.pin-box');
      var verifyBtn = document.getElementById('verifyPinBtn');
      var numpad = document.getElementById('pinNumpad');
      var backBtn = document.getElementById('pinNumpadBack');
      function getNext() {
        for (var i = 0; i < boxes.length; i++) {
          if (!boxes[i].value) return boxes[i];
        }
        return boxes[boxes.length - 1];
      }
      function getPrev() {
        for (var i = boxes.length - 1; i >= 0; i--) {
          if (boxes[i].value) return boxes[i];
        }
        return boxes[0];
      }
      boxes.forEach(function (b, i) {
        b.addEventListener('input', function () {
          this.value = this.value.replace(/\D/g, '').slice(0, 1);
          if (this.value && i < boxes.length - 1) boxes[i + 1].focus();
        });
        b.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && !this.value && i > 0) boxes[i - 1].focus();
        });
      });
      numpad.querySelectorAll('.numpad-btn[data-n]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var next = getNext();
          next.value = this.getAttribute('data-n');
          next.focus();
          var idx = parseInt(next.getAttribute('data-i'), 10);
          if (idx < boxes.length - 1) boxes[idx + 1].focus();
        });
      });
      backBtn.addEventListener('click', function () {
        var prev = getPrev();
        prev.value = '';
        prev.focus();
      });
      verifyBtn.addEventListener('click', function () {
        var pin = Array.prototype.map.call(boxes, function (b) { return b.value; }).join('');
        if (pin.length === 4) {
          window.location.href = 'pin-success.html';
        } else alert('Please enter all 4 digits.');
      });
    })();
  </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
