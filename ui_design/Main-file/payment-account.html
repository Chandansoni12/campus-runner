<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Payment Account - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="wallet-page">
  <div class="wallet-flow">
    <header class="profile-flow-header">
      <a href="payment-selection.html" class="back-btn-profile" aria-label="Back"><svg width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg></a>
      <h1 class="profile-flow-title">Payment Account</h1>
    </header>
    <main class="wallet-main">
      <a href="your-card.html" class="wallet-item wallet-item-link">
        <div class="wallet-item-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2" />
            <path d="M1 10h22" />
          </svg>
        </div>
        <div class="wallet-item-left">
          <span class="wallet-item-title">Your Card</span>
          <span class="wallet-item-sub">View and manage your cards</span>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>
      <div class="wallet-item">
        <div class="wallet-item-icon">
          <img src="assets/img/icon/icon1.png" alt="Apple Pay" width="24" height="24">
        </div>
        <div class="wallet-item-left">
          <span class="wallet-item-title">Apple Pay</span>
          <span class="wallet-item-sub">Connected</span>
        </div>
        <a href="#" class="wallet-badge remove" data-payment="apple">Remove</a>
      </div>
      <div class="wallet-item">
        <div class="wallet-item-icon">
          <img src="assets/img/icon/icon2.png" alt="Google Pay" width="24" height="24">
        </div>
        <div class="wallet-item-left">
          <span class="wallet-item-title">Google Pay</span>
          <span class="wallet-item-sub">Connected</span>
        </div>
        <a href="#" class="wallet-badge remove" data-payment="google">Remove</a>
      </div>
      <div class="wallet-item">
        <div class="wallet-item-icon">
          <img src="assets/img/icon/icon3.png" alt="PayPal" width="24" height="24">
        </div>
        <div class="wallet-item-left">
          <span class="wallet-item-title">PayPal</span>
          <span class="wallet-item-sub">Unconnected</span>
        </div>
        <a href="#" class="wallet-badge connect" data-payment="paypal">Connect</a>
      </div>
      <a href="add-new-card.html" class="btn-profile-primary wallet-footer-btn">Add New Card</a>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Handle connect/remove button clicks
    document.querySelectorAll('.wallet-badge.connect, .wallet-badge.remove').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.preventDefault();

        const paymentType = this.getAttribute('data-payment');
        const isConnect = this.classList.contains('connect');
        const walletItem = this.closest('.wallet-item');
        const statusText = walletItem.querySelector('.wallet-item-sub');

        if (isConnect) {
          // Change to connected state
          this.textContent = 'Remove';
          this.classList.remove('connect');
          this.classList.add('remove');
          statusText.textContent = 'Connected';

          // Show success feedback
          const originalText = this.textContent;
          this.textContent = '✓ Connected';
          setTimeout(() => {
            this.textContent = originalText;
          }, 1500);
        } else {
          // Change to unconnected state
          this.textContent = 'Connect';
          this.classList.remove('remove');
          this.classList.add('connect');
          statusText.textContent = 'Unconnected';

          // Show feedback
          const originalText = this.textContent;
          const originalBg = this.style.backgroundColor;
          this.textContent = '✓ Removed';
          this.style.backgroundColor = '#6b7280';
          setTimeout(() => {
            this.textContent = originalText;
            this.style.backgroundColor = originalBg;
          }, 1500);
        }

        console.log(`${isConnect ? 'Connected' : 'Removed'} ${paymentType}`);
      });
    });
  </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
