<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes" <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
    <title>Enter OTP - Delivo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="auth-page">
    <!-- Enter OTP Screen -->
    <div class="screen active" id="otp-entry">
        <div class="container h-100">
            <div class="row h-100">
                <div class="col-12 d-flex flex-column">
                    <div class="back-button">
                        <button class="btn-back" onclick="window.location.href='forgot-password.html'">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <div class="verify-content-compact text-center">
                        <div class="icon-wrapper">
                            <div class="email-icon">
                                <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                                    <path d="M10 15L30 30L50 15" stroke="white" stroke-width="3" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                    <rect x="7" y="12" width="46" height="36" rx="4" stroke="white" stroke-width="3"
                                        fill="none" />
                                </svg>
                            </div>
                        </div>

                        <h1 class="verify-title-small">Please Enter OTP</h1>
                        <p class="verify-subtitle-small">Enter the 6 digit code we sent by email</p>

                        <div class="code-inputs-compact">
                            <input type="text" maxlength="1" class="code-input-small" data-index="0">
                            <input type="text" maxlength="1" class="code-input-small" data-index="1">
                            <input type="text" maxlength="1" class="code-input-small" data-index="2">
                            <input type="text" maxlength="1" class="code-input-small" data-index="3">
                            <input type="text" maxlength="1" class="code-input-small" data-index="4">
                            <input type="text" maxlength="1" class="code-input-small" data-index="5">
                        </div>

                        <button class="btn btn-primary btn-verify-small" id="verify-otp-btn">Verify</button>

                        <p class="resend-text-small">Didn't receive the code? <a href="#" class="resend-link-large"
                                id="resend-otp-link">Resend Code</a></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="home-indicator"></div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/script.js"></script>
    <script src="./assets/js/realtime-mock.js"></script>
    <script src="assets/js/auth-script.js"></script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
