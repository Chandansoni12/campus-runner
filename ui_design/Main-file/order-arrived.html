<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes" <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
    <title>Order Arrived - Delivo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="order-arrived-page">


    <!-- Order Arrived Screen -->
    <div class="order-arrived-screen">
        <header class="order-arrived-header">
            <a href="home.html" class="back-btn back-btn--dark" aria-label="Back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>
        </header>

        <div class="order-arrived-content">
            <div class="order-arrived-icon-wrapper">
                <div class="order-arrived-icon-circle">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 6L9 17L4 12" stroke="white" stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="order-arrived-confetti">
                    <span class="confetti-dot"></span>
                    <span class="confetti-dot"></span>
                    <span class="confetti-dot"></span>
                    <span class="confetti-dot"></span>
                    <span class="confetti-dot"></span>
                    <span class="confetti-dot"></span>
                    <span class="confetti-x"></span>
                    <span class="confetti-x"></span>
                    <span class="confetti-x"></span>
                    <span class="confetti-x"></span>
                </div>
            </div>

            <h2 class="order-arrived-title">Your order has arrived!</h2>
            <p class="order-arrived-message" id="order-arrived-message">Right on time, we delivered your order in 25 min
            </p>
            <a href="rating-driver.html" class="order-arrived-rate-btn">Rate Driver</a>
        </div>

        <div class="home-indicator home-indicator--light"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var min = localStorage.getItem('deliveryMinutes') || '25';
            document.getElementById('order-arrived-message').textContent = 'Right on time, we delivered your order in ' + min + ' min';
        })();
    </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
