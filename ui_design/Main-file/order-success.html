<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes" <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
    <title>Order Success - Delivo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="order-success-page">
    <!-- Status Bar -->


    <!-- Order Success Screen -->
    <div class="order-success-screen">
        <!-- Header -->
        <header class="order-success-header">
            <button class="back-btn" onclick="window.location.href='home.html'" aria-label="Close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <h1 class="order-success-title">Checkout</h1>
        </header>

        <!-- Content Area -->
        <div class="order-success-content">
            <div class="success-icon-wrapper">
                <div class="success-icon-circle">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 6L9 17L4 12" stroke="white" stroke-width="3" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="confetti-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <h2 class="success-title">Order Successfully</h2>

            <p class="success-message">
                Happy! Your food will be made immediately and we will send it after it's finished by the courier.
            </p>
        </div>

        <div class="home-indicator"></div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
        // Store order data for tracking
        const orderData = localStorage.getItem('currentOrder');
        if (orderData) {
            // Keep order data for tracking page
            // localStorage.setItem('trackingOrder', orderData);
        }

        // Clear cart after successful order
        localStorage.removeItem('cartItems');
        localStorage.removeItem('newCardData');

        // Auto redirect to order tracking after 2 seconds
        setTimeout(() => {
            window.location.href = 'order-placed.html';
        }, 2000);
    </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
