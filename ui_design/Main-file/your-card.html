<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Your Card - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="wallet-page">

  <div class="wallet-flow">
    <header class="profile-flow-header">
      <a href="payment-account.html" class="back-btn-profile" aria-label="Back"><svg width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg></a>
      <h1 class="profile-flow-title">Your Card</h1>
    </header>
    <main class="wallet-main your-card-main">
      <div class="your-card-list" id="yourCardList">
        <!-- Mastercard - Dark -->
        <div class="card-option-row">
          <div class="card-visual card-visual-dark">
            <div class="card-visual-top">
              <div class="card-balance-info">
                <span class="card-visual-label">Current Balance</span>
                <div class="card-visual-amount">$4,570.80</div>
              </div>
              <img src="assets/img/card/mastercard.png" alt="Mastercard" class="card-logo">
            </div>
            <div class="card-visual-bottom">
              <span class="card-number">5294 2436 4780 9568</span>
              <span class="card-expiry">12/24</span>
            </div>
          </div>
          <div class="card-option-meta">
            <label class="card-checkbox-label">
              <input type="radio" name="defaultCard" value="1" class="card-radio" checked>
              <span class="card-checkbox-custom"></span>
              <span class="use-default-text">Use as default payment method</span>
            </label>
          </div>
        </div>

        <!-- Visa - Purple -->
        <div class="card-option-row">
          <div class="card-visual card-visual-purple">
            <div class="card-visual-top">
              <div class="card-balance-info">
                <span class="card-visual-label">Current Balance</span>
                <div class="card-visual-amount">$3,242,23</div>
              </div>
              <img src="assets/img/card/visa.png" alt="Visa" class="card-logo">
            </div>
            <div class="card-visual-bottom">
              <span class="card-number">9865 3567 4563 4235</span>
              <span class="card-expiry">12/24</span>
            </div>
          </div>
          <div class="card-option-meta">
            <label class="card-checkbox-label">
              <input type="radio" name="defaultCard" value="2" class="card-radio">
              <span class="card-checkbox-custom"></span>
              <span class="use-default-text">Use as default payment method</span>
            </label>
          </div>
        </div>
      </div>
      <a href="add-new-card.html" class="btn-profile-primary wallet-footer-btn">Add New Card</a>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
