<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Language - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="profile-flow-page">
  <div class="status-ber status-ber-sub">
    <div class="time">9:41</div>
    <div class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="1" fill="white" />
        <rect x="5" y="5" width="3" height="7" rx="1" fill="white" />
        <rect x="10" y="2" width="3" height="10" rx="1" fill="white" />
        <rect x="15" y="0" width="3" height="12" rx="1" fill="white" />
      </svg><svg width="24" height="12" viewBox="0 0 24 12" fill="none">
        <rect x="1" y="1" width="18" height="10" rx="2" stroke="white" stroke-width="2" />
        <rect x="3" y="3" width="14" height="6" rx="1" fill="white" />
        <rect x="20" y="4" width="3" height="4" rx="1" fill="white" />
      </svg></div>
  </div>
  <div class="profile-flow">
    <header class="profile-flow-header">
      <a href="user-profile.html" class="back-btn-profile" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <h1 class="profile-flow-title">Language</h1>
    </header>

    <main class="profile-flow-main">
      <div class="language-section">
        <div class="language-section-label">Suggested</div>
        <div class="language-list">
          <label class="language-option">
            <span class="language-name">English (US)</span>
            <input type="radio" name="language" value="en-US" checked class="language-radio">
            <span class="language-radio-ui"></span>
          </label>
          <label class="language-option">
            <span class="language-name">English (UK)</span>
            <input type="radio" name="language" value="en-GB" class="language-radio">
            <span class="language-radio-ui"></span>
          </label>
        </div>
      </div>
      <div class="language-section">
        <div class="language-section-label">Others</div>
        <div class="language-list">
          <label class="language-option">
            <span class="language-name">Hindi</span>
            <input type="radio" name="language" value="hi" class="language-radio">
            <span class="language-radio-ui"></span>
          </label>
          <label class="language-option">
            <span class="language-name">Spanish</span>
            <input type="radio" name="language" value="es" class="language-radio">
            <span class="language-radio-ui"></span>
          </label>
          <label class="language-option">
            <span class="language-name">Arabic</span>
            <input type="radio" name="language" value="ar" class="language-radio">
            <span class="language-radio-ui"></span>
          </label>
          <label class="language-option">
            <span class="language-name">Bengali</span>
            <input type="radio" name="language" value="bn" class="language-radio">
            <span class="language-radio-ui"></span>
          </label>
        </div>
      </div>
      <button type="button" class="btn-profile-primary" id="languageChangeBtn">Change</button>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('languageChangeBtn').addEventListener('click', function () {
      var selected = document.querySelector('input[name="language"]:checked');
      if (selected) window.location.href = 'user-profile.html';
    });
  </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
