<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Personal Data - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="profile-flow-page">
  <div class="profile-flow-page-scroll">
    <div class="status-ber status-ber-sub">
      <div class="time">9:41</div>
      <div class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="none">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="white" />
          <rect x="5" y="5" width="3" height="7" rx="1" fill="white" />
          <rect x="10" y="2" width="3" height="10" rx="1" fill="white" />
          <rect x="15" y="0" width="3" height="12" rx="1" fill="white" />
        </svg><svg width="24" height="12" viewBox="0 0 24 12" fill="none">
          <rect x="1" y="1" width="18" height="10" rx="2" stroke="white" stroke-width="2" />
          <rect x="3" y="3" width="14" height="6" rx="1" fill="white" />
          <rect x="20" y="4" width="3" height="4" rx="1" fill="white" />
        </svg></div>
    </div>
    <div class="profile-flow">
      <header class="profile-flow-header">
        <a href="user-profile.html" class="back-btn-profile" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </a>
        <h1 class="profile-flow-title">Personal Data</h1>
      </header>

      <main class="profile-flow-main">
        <div class="personal-data-avatar-wrap">
          <div class="personal-data-avatar">
            <img id="personalDataAvatar" src="assets/img/profile.png" alt="Profile">
            <a href="add-profile-photo.html" class="avatar-edit-btn" aria-label="Change photo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
              </svg>
            </a>
          </div>
        </div>

        <form class="personal-data-form" id="personalDataForm">
          <div class="form-group-profile">
            <label class="form-label-profile">Full Name</label>
            <input type="text" class="form-input-profile" name="fullName" value="Jenny Wilson">
          </div>
          <div class="form-group-profile">
            <label class="form-label-profile">Email</label>
            <input type="email" class="form-input-profile" name="email" value="wilsong@gmail.com">
          </div>
          <div class="form-group-profile">
            <label class="form-label-profile">Phone Number</label>
            <div class="phone-input-wrap">
              <span class="phone-flag">🇺🇸</span>
              <input type="tel" class="form-input-profile form-input-phone" name="phone" value="+1 - 304 555 0121">
            </div>
          </div>
          <div class="form-group-profile">
            <label class="form-label-profile">Date of Birth</label>
            <input type="text" class="form-input-profile" name="dob" value="November 24, 2000"
              placeholder="Select date">
          </div>
          <div class="form-group-profile">
            <label class="form-label-profile">Gender</label>
            <select class="form-input-profile form-select-profile" name="gender">
              <option value="">Select gender</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button type="submit" class="btn-profile-primary">Save Changes</button>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('personalDataForm').addEventListener('submit', function (e) {
      e.preventDefault();
      window.location.href = 'user-profile.html';
    });
  </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
