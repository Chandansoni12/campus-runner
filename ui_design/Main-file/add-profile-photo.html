<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Add Profile Photo - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="profile-flow-page">
  <div class="status-ber status-ber-sub">
    <div class="time">9:41</div>
    <div class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="1" fill="white" />
        <rect x="5" y="5" width="3" height="7" rx="1" fill="white" />
        <rect x="10" y="2" width="3" height="10" rx="1" fill="white" />
        <rect x="15" y="0" width="3" height="12" rx="1" fill="white" />
      </svg><svg width="24" height="12" viewBox="0 0 24 12" fill="none">
        <rect x="1" y="1" width="18" height="10" rx="2" stroke="white" stroke-width="2" />
        <rect x="3" y="3" width="14" height="6" rx="1" fill="white" />
        <rect x="20" y="4" width="3" height="4" rx="1" fill="white" />
      </svg></div>
  </div>
  <div class="profile-flow">
    <header class="profile-flow-header">
      <a href="#" class="back-btn-profile" id="backBtn" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <h1 class="profile-flow-title">Add Profile Photo</h1>
    </header>

    <main class="profile-flow-main">
      <div class="add-photo-block">
        <div class="add-photo-avatar">
          <img id="profilePhotoPreview" src="assets/img/profile.png" alt="Profile">
        </div>
        <button type="button" class="btn-upload-photo" id="uploadPhotoBtn">Upload New Photo</button>
        <input type="file" id="photoInput" accept="image/*" class="d-none">
      </div>
      <button type="button" class="btn-profile-primary" id="savePhotoBtn">Save Changes</button>
    </main>
  </div>

  <!-- Success Modal (Screen 4) -->
  <div class="profile-modal-overlay" id="successModal" aria-hidden="true">
    <div class="profile-modal profile-modal-success">
      <div class="profile-modal-icon success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>
      <h2 class="profile-modal-title">Profile Update Successfully</h2>
      <p class="profile-modal-text">Congratulations! Your changes have been saved. Your profile is now up-to-date.</p>
      <button type="button" class="btn-profile-primary" id="successModalClose">Done</button>
    </div>
  </div>

  <!-- Exit Confirmation Modal (Screen 5) -->
  <div class="profile-modal-overlay" id="exitModal" aria-hidden="true">
    <div class="profile-modal profile-modal-exit">
      <div class="profile-modal-icon exit-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          <path d="M12 14h.01" />
        </svg>
      </div>
      <h2 class="profile-modal-title">Are you sure want to exit without saving your profile?</h2>
      <p class="profile-modal-text">If you exit now any changes you haven't saved will be lost.</p>
      <div class="profile-modal-actions">
        <button type="button" class="btn-profile-outline" id="exitModalCancel">Cancel</button>
        <button type="button" class="btn-profile-primary" id="exitModalConfirm">Yes</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      var backBtn = document.getElementById('backBtn');
      var savePhotoBtn = document.getElementById('savePhotoBtn');
      var uploadPhotoBtn = document.getElementById('uploadPhotoBtn');
      var photoInput = document.getElementById('photoInput');
      var preview = document.getElementById('profilePhotoPreview');
      var successModal = document.getElementById('successModal');
      var exitModal = document.getElementById('exitModal');
      var successModalClose = document.getElementById('successModalClose');
      var exitModalCancel = document.getElementById('exitModalCancel');
      var exitModalConfirm = document.getElementById('exitModalConfirm');
      var hasChanges = false;

      function openSuccess() {
        successModal.setAttribute('aria-hidden', 'false');
        successModal.classList.add('is-open');
      }
      function closeSuccess() {
        successModal.setAttribute('aria-hidden', 'true');
        successModal.classList.remove('is-open');
        window.location.href = 'personal-data.html';
      }
      function openExit() {
        exitModal.setAttribute('aria-hidden', 'false');
        exitModal.classList.add('is-open');
      }
      function closeExit() {
        exitModal.setAttribute('aria-hidden', 'true');
        exitModal.classList.remove('is-open');
      }

      uploadPhotoBtn.addEventListener('click', function () { photoInput.click(); });
      photoInput.addEventListener('change', function () {
        var file = this.files[0];
        if (!file) return;
        hasChanges = true;
        var r = new FileReader();
        r.onload = function () { preview.src = r.result; };
        r.readAsDataURL(file);
      });

      savePhotoBtn.addEventListener('click', function () {
        openSuccess();
      });

      successModalClose.addEventListener('click', closeSuccess);
      successModal.addEventListener('click', function (e) { if (e.target === successModal) closeSuccess(); });

      backBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (hasChanges) openExit();
        else window.location.href = 'personal-data.html';
      });

      exitModalCancel.addEventListener('click', closeExit);
      exitModalConfirm.addEventListener('click', function () {
        closeExit();
        window.location.href = 'personal-data.html';
      });
      exitModal.addEventListener('click', function (e) { if (e.target === exitModal) closeExit(); });
    })();
  </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
