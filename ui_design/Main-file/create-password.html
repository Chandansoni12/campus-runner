<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Create New Password - Delivo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="auth-page">
    <!-- Create New Password Screen -->
    <div class="screen active" id="create-password">
        <div class="container h-100">
            <div class="row h-100">
                <div class="col-12 d-flex flex-column justify-content-center">
                    <div class="back-button">
                        <button class="btn-back" onclick="window.location.href='forgot-password-otp.html'">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <div class="auth-content">
                        <h1 class="auth-title">Create New Password</h1>
                        <p class="auth-subtitle">Choose a strong password to secure your account.<br>Make sure it's
                            something unique and memorable!</p>

                        <form class="auth-form" id="create-password-form">
                            <div class="form-group">
                                <label for="new-password" class="form-label">Password</label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-control" id="new-password"
                                        placeholder="Enter your password" value="************">
                                    <span class="password-toggle">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M12 5C7.5 5 3.73 7.61 2 11.5C3.73 15.39 7.5 18 12 18C16.5 18 20.27 15.39 22 11.5C20.27 7.61 16.5 5 12 5ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16ZM12 10C10.9 10 10 10.9 10 12C10 13.1 10.9 14 12 14C13.1 14 14 13.1 14 12C14 10.9 13.1 10 12 10Z"
                                                fill="currentColor"></path>
                                        </svg>
                                    </span>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="confirm-password" class="form-label">Confirm Password</label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-control" id="confirm-password"
                                        placeholder="Confirm your password" value="Password1234">
                                    <span class="password-toggle">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M12 5C7.5 5 3.73 7.61 2 11.5C3.73 15.39 7.5 18 12 18C16.5 18 20.27 15.39 22 11.5C20.27 7.61 16.5 5 12 5ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16ZM12 10C10.9 10 10 10.9 10 12C10 13.1 10.9 14 12 14C13.1 14 14 13.1 14 12C14 10.9 13.1 10 12 10Z"
                                                fill="currentColor"></path>
                                        </svg>
                                    </span>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-auth">Create New Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="home-indicator"></div>
    </div>

    <!-- Password Changed Success Modal -->
    <div class="modal-overlay" id="password-changed-modal">
        <div class="password-success-modal">
            <div class="success-icon-circle-modal">
                <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.667 28.0002L23.3337 39.6668L46.667 16.3335" stroke="white" stroke-width="4.66667"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <h2 class="modal-title">Password Changed!</h2>
            <p class="modal-subtitle">Your password has been successfully updated. You can now log in with your new
                password.</p>
            <button class="btn btn-primary btn-modal" onclick="window.location.href='home.html'">Back to Home</button>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/script.js"></script>
    <script src="./assets/js/realtime-mock.js"></script>
    <script src="assets/js/auth-script.js"></script>
    <script>
        // Handle create password form submission
        document.getElementById('create-password-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Validation
            if (!password || !confirmPassword) {
                alert('Please fill in all fields');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            // Show success modal
            document.getElementById('password-changed-modal').classList.add('active');
        });

        // Password toggle functionality is handled by auth-script.js
    </script>
</body>

</html>
