<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes" <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
    <title>Forgot Password - Delivo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="auth-page">
    <!-- Status Bar -->


    <!-- Forgot Password Screen -->
    <div class="screen active" id="forgot-password">
        <div class="container h-100">
            <div class="row h-100">
                <div class="col-12 d-flex flex-column justify-content-center">
                    <div class="back-button">
                        <button class="btn-back" onclick="window.location.href='signin.html'">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M16.875 10H3.125" stroke="white" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M8.75 4.375L3.125 10L8.75 15.625" stroke="white" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <div class="auth-content">
                        <h1 class="auth-title">Forgot Password</h1>
                        <p class="auth-subtitle">enter your email address and we will help you to restore your account.
                        </p>

                        <form class="auth-form" id="forgot-password-form">
                            <div class="form-group">
                                <label for="forgot-email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="forgot-email"
                                    placeholder="wilson@09gail.com" value="wilson@09gail.com">
                            </div>

                            <button type="submit" class="btn btn-primary btn-auth">Send OTP</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="home-indicator"></div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/script.js"></script>
    <script src="./assets/js/realtime-mock.js"></script>
    <script src="assets/js/auth-script.js"></script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
