<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Add New Card - Billing - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="wallet-page">
  <div class="status-ber status-ber-sub">
    <div class="time">9:41</div>
    <div class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="1" fill="white" />
        <rect x="5" y="5" width="3" height="7" rx="1" fill="white" />
        <rect x="10" y="2" width="3" height="10" rx="1" fill="white" />
        <rect x="15" y="0" width="3" height="12" rx="1" fill="white" />
      </svg><svg width="24" height="12" viewBox="0 0 24 12" fill="none">
        <rect x="1" y="1" width="18" height="10" rx="2" stroke="white" stroke-width="2" />
        <rect x="3" y="3" width="14" height="6" rx="1" fill="white" />
        <rect x="20" y="4" width="3" height="4" rx="1" fill="white" />
      </svg></div>
  </div>
  <div class="wallet-flow">
    <header class="profile-flow-header">
      <a href="add-new-card.html" class="back-btn-profile" aria-label="Back"><svg width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg></a>
      <h1 class="profile-flow-title">Add New Card</h1>
    </header>
    <main class="wallet-main add-card-main">
      <div class="card-preview card-preview-orange">
        <div class="card-preview-balance">$3,242.23</div>
        <div class="card-preview-logo">VISA</div>
      </div>
      <form class="wallet-form" id="billingForm">
        <div class="form-group-profile">
          <label class="form-label-profile">Street Address</label>
          <input type="text" class="form-input-profile" name="street" placeholder="Enter street address" required>
        </div>
        <div class="form-group-profile">
          <label class="form-label-profile">City</label>
          <input type="text" class="form-input-profile" name="city" placeholder="Enter city" required>
        </div>
        <div class="form-row-2">
          <div class="form-group-profile">
            <label class="form-label-profile">State</label>
            <input type="text" class="form-input-profile" name="state" placeholder="State" required>
          </div>
          <div class="form-group-profile">
            <label class="form-label-profile">Zip Code</label>
            <input type="text" class="form-input-profile" name="zip" placeholder="Zip" required>
          </div>
        </div>
        <button type="submit" class="btn-profile-primary">Add Card</button>
      </form>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('billingForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var street = this.street.value.trim();
      var city = this.city.value.trim();
      var state = this.state.value.trim();
      var zip = this.zip.value.trim();
      if (!street || !city || !state || !zip) { alert('Please fill all fields.'); return; }
      sessionStorage.setItem('addCardBilling', JSON.stringify({ street: street, city: city, state: state, zip: zip }));
      window.location.href = 'email-verify.html?from=card';
    });
  </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
