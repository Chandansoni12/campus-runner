<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Notifications - Delivo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="profile-flow-page">
  <div class="status-ber status-ber-sub">
    <div class="time">9:41</div>
    <div class="status-icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="1" fill="white" />
        <rect x="5" y="5" width="3" height="7" rx="1" fill="white" />
        <rect x="10" y="2" width="3" height="10" rx="1" fill="white" />
        <rect x="15" y="0" width="3" height="12" rx="1" fill="white" />
      </svg><svg width="24" height="12" viewBox="0 0 24 12" fill="none">
        <rect x="1" y="1" width="18" height="10" rx="2" stroke="white" stroke-width="2" />
        <rect x="3" y="3" width="14" height="6" rx="1" fill="white" />
        <rect x="20" y="4" width="3" height="4" rx="1" fill="white" />
      </svg></div>
  </div>
  <div class="profile-flow">
    <header class="profile-flow-header">
      <a href="user-profile.html" class="back-btn-profile" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <h1 class="profile-flow-title">Notifications</h1>
    </header>

    <main class="profile-flow-main">
      <div class="notifications-list">
        <div class="notification-row">
          <span class="notification-label">Notifications</span>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notification-row">
          <span class="notification-label">Sound</span>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notification-row">
          <span class="notification-label">Vibrate</span>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notification-row">
          <span class="notification-label">Special Offers</span>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notification-row">
          <span class="notification-label">Payments</span>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notification-row">
          <span class="notification-label">Cashback</span>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notification-row">
          <span class="notification-label">App Updates</span>
          <label class="toggle-wrap">
            <input type="checkbox" class="toggle-input" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      <button type="button" class="btn-profile-primary" id="notificationsSaveBtn">Save</button>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('notificationsSaveBtn').addEventListener('click', function () {
      window.location.href = 'user-profile.html';
    });
  </script>
    <script src="./assets/js/realtime-mock.js"></script>
</body>

</html>
